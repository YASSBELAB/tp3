    "/api/products/{id}/price": {
      "patch": {
        "tags": [
          "product-controller"
        ],
        "summary": "Mettre à jour le prix d'un produit",
        "description": "Met à jour uniquement le prix d'un produit existant. Cette opération est réservée aux rôles MANAGER et ADMIN.",
        "operationId": "updatePrice",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "description": "Identifiant du produit",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "example": 1
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PriceUpdateDto"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Prix du produit mis à jour avec succès",
            "content": {
              "*/*": {
                "schema": {
                  "$ref": "#/components/schemas/ProductDto"
                }
              }
            }
          },
          "400": {
            "description": "Prix invalide"
          },
          "401": {
            "description": "Utilisateur non authentifié"
          },
          "403": {
            "description": "Accès réservé aux MANAGER et ADMIN"
          },
          "404": {
            "description": "Produit introuvable"
          }
        }
      }
    },
